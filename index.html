    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // دالة تشفير (تحويل لنظام سداسي عشر) مضمونة 100% على جميع الأجهزة والمتصفحات
        const simpleHash = (str) => {
            if (!str) return '';
            let hex = '';
            for(let i = 0; i < str.length; i++) {
                hex += str.charCodeAt(i).toString(16);
            }
            return hex;
        };

        const BASE_STUDENTS = {
            // أرقام سرية مشفرة بالدالة الجديدة المضمونة
            "01228466613": { role: "admin", name: "eslam", passHash: "343432303034" }, // 442004
            "01205058940": { role: "secretary", name: "mostafa", passHash: "30" } // 0
        };

        const subjectName = "دراسات اجتماعية";
        const gradeName = "الصف الثالث الإعدادي";
        const PAYMENT_INFO = { fee: "50 جنيهاً", vodafoneCash: "01228466613", instapay: "01228466613" };

        const toEasternArabic = (num) => String(num).split('').map(digit => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][digit] || digit).join('');

        const formatPhoneStr = (phone) => {
            if (!phone) return "";
            let cleaned = String(phone).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[\s\+\.]/g, "");
            if (cleaned.startsWith("20") && cleaned.length > 10) cleaned = cleaned.substring(2);
            if (cleaned.length === 10 && cleaned.startsWith("1")) cleaned = "0" + cleaned;
            return cleaned;
        };

        // دالة البصمة تعتمد على عتاد الهاتف فقط كما هو مطلوب تماماً لكي لا يحظر الطالب على نفس الهاتف
        const generateDeviceFingerprint = () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top"; ctx.font = "14px 'Arial'"; ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60"; ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069"; ctx.fillText("EdTech-Fingerprint", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)"; ctx.fillText("EdTech-Fingerprint", 4, 17);
            const b64 = canvas.toDataURL().replace("data:image/png;base64,","");
            const bin = atob(b64);
            const crc32 = function(r){for(var a,o=[],c=0;c<256;c++){a=c;for(var f=0;f<8;f++)a=1&a?3988292384^a>>>1:a>>>1;o[c]=a}for(var n=-1,t=0;t<r.length;t++)n=n>>>8^o[255&(n^r.charCodeAt(t))];return(-1^n)>>>0};
            
            return crc32(bin).toString(16);
        };

        // دالة ذكية لتحويل رابط جوجل درايف العادي إلى رابط تشغيل مباشر
        const getDriveDirectLink = (url) => {
            if (!url) return '';
            const driveRegex = /\/file\/d\/([a-zA-Z0-9_-]+)/;
            const idRegex = /id=([a-zA-Z0-9_-]+)/;
            let fileId = null;
            if (url.match(driveRegex)) fileId = url.match(driveRegex)[1];
            else if (url.match(idRegex)) fileId = url.match(idRegex)[1];
            if (fileId) return `https://drive.google.com/uc?export=download&id=${fileId}`;
            return url;
        };

        // دالة ذكية لتحويل رابط يوتيوب العادي إلى رابط مشاهدة داخل المنصة
        const getYoutubeEmbedLink = (url) => {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            if (match && match[2].length === 11) return `https://www.youtube.com/embed/${match[2]}`;
            return url;
        };

        const buildCourseData = (flatQuestions) => {
            const course = [];
            const completedLessons = JSON.parse(localStorage.getItem('completedLessons') || '[]');
            flatQuestions.forEach(row => {
                const unitTitle = row.unit || "وحدة عامة"; const lessonTitle = row.section || "درس عام";
                let unit = course.find(u => u.title === unitTitle);
                if (!unit) { unit = { id: `unit_${simpleHash(unitTitle)}`, title: unitTitle, lessons: [] }; course.push(unit); }
                const lessonId = `lesson_${simpleHash(unitTitle + lessonTitle)}`;
                let lesson = unit.lessons.find(l => l.title === lessonTitle);
                
                // إضافة المتغير audio و video للدرس لاحتواء الروابط إن وجدت
                if (!lesson) { lesson = { id: lessonId, title: lessonTitle, questions: [], completed: completedLessons.includes(lessonId), audio: null, video: null }; unit.lessons.push(lesson); }
                
                // إذا كان هذا الصف يحتوي على رابط صوتي، نقوم بربطه بالدرس
                if (!lesson.audio && row.audio && row.audio.toString().trim() !== "") {
                    lesson.audio = row.audio.toString().trim();
                }
                // إذا كان هذا الصف يحتوي على رابط فيديو، نقوم بربطه بالدرس
                if (!lesson.video && row.video && row.video.toString().trim() !== "") {
                    lesson.video = row.video.toString().trim();
                }

                const options = [row.opt1, row.opt2, row.opt3, row.opt4].filter(o => o && o.toString().trim() !== "");
                
                // تنظيف الكلمة من المسافات الزائدة والحروف الكبيرة، أو اكتب السؤال المقالي تلقائياً إذا كانت الخلية فارغة
                let determinedType = (row.type || "").toString().trim().toLowerCase();
                if (!determinedType) {
                    determinedType = options.length > 0 ? "mcq" : "essay";
                }

                lesson.questions.push({
                    type: determinedType, q: row.q, options: options, correct: row.correct,
                    reason: row.reason, answer: row.reason, concept: row.concept,
                    paragraph: row.paragraph, section: lessonTitle
                });
            });
            return course;
        };

        const formatLessonTitle = (title) => {
            if (!title) return title;
            const parts = title.split(':');
            if (parts.length > 1) {
                return <><span className="text-secondary font-black">{parts[0]}:</span>{parts.slice(1).join(':')}</>;
            }
            return title;
        };

        const highlightText = (text, concept) => {
            if (text === undefined || text === null) return "";
            let processedText = String(text).replace(/(^|\s+)([0-9٠-٩]{1,2}\s*[-ـ\)])/g, '\n$2');
            const continents = ['آسيا', 'أوروبا', 'إفريقيا', 'أمريكا الشمالية', 'أمريكا الجنوبية', 'أستراليا', 'القارة القطبية'];
            const countries = ['مصر', 'الشام', 'العراق', 'فلسطين', 'سوريا', 'السعودية', 'اليمن', 'عمان', 'المغرب', 'الجزائر', 'تونس', 'ليبيا', 'السودان', 'الصومال', 'جيبوتي', 'موريتانيا'];
            const other_entities = ['الوطن العربي', 'الإسلامي', 'الطولونية', 'الإخشيدية', 'الفاطمية', 'الأيوبية', 'المملوكية', 'العثماني', 'الفرنسية', 'صلاح الدين', 'عمر بن الخطاب', 'الأموي', 'العباسي', 'الفارسي', 'الرومي', 'البيزنطي', 'المحيط الهندي', 'المحيط الأطلنطي', 'البحر الأحمر', 'البحر المتوسط'];
            const keywords = ['أولى', 'الأولى', 'أول', 'الأول', 'ثاني', 'الثاني', 'ثانية', 'الثانية', 'ثالث', 'الثالث', 'ثالثة', 'الثالثة', 'رابع', 'الرابع', 'رابعة', 'الرابعة', 'خامس', 'الخامس', 'خامسة', 'الالخامسة', 'سادس', 'السادس', 'سادسة', 'السادسة', 'سابع', 'السابع', 'سابعة', 'السابعة', 'ثامن', 'الثامن', 'ثامنة', 'الثامنة', 'تاسع', 'التاسع', 'تاسعة', 'التاسعة', 'عاشر', 'العاشر', 'عاشرة', 'العاشرة', 'أعلى', 'أقل', 'أكثر', 'يختلف', 'تختلف', 'تتشابه', 'أكبر', 'أصغر', 'أهم', 'أطول', 'أقصر', 'أسرع', 'أبطأ', 'شرق', 'غرب', 'شمال', 'جنوب', 'صيفاً', 'شتاءً', 'نادر', 'دائم', 'مؤقت', 'إيجابي', 'سلبي'];
            
            let elements = [{ type: 'text', content: processedText }];
            
            const processElements = (elems, regex, type) => {
                let newElems = [];
                elems.forEach(el => {
                    if (el.type !== 'text') return newElems.push(el);
                    el.content.split(regex).forEach((part, idx) => {
                        if (part) newElems.push({ type: idx % 2 === 1 ? type : 'text', content: part });
                    });
                });
                return newElems;
            };

            elements = processElements(elements, /((?:["'«”])[^"'»“]+(?:["'»“]))/g, 'quote');
            elements = processElements(elements, /(\([^0-9٠-٩][^)]+\))/g, 'parenthesis');
            elements = processElements(elements, /\*\*(.*?)\*\*/g, 'manual');
            elements = processElements(elements, /([0-9٠-٩]{1,2}\s*[-ـ\)]\s*[^\s]+)/g, 'numbered_start');

            if (concept) {
                const escapedConcept = concept.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                elements = processElements(elements, new RegExp(`([\\u0600-\\u06FF]*${escapedConcept}[\\u0600-\\u06FF]*)`, 'gi'), 'concept');
            }
            
            // تمييز الأرقام والتواريخ
            elements = processElements(elements, /((?:[0-9٠-٩]+)(?:\s*(?:ق\.م|م|هـ))?)/g, 'number_date');
            
            // تمييز الكلمات المفتاحية
            elements = processElements(elements, new RegExp(`([\\u0600-\\u06FF]*(?:${keywords.join('|')})[\\u0600-\\u06FF]*)`, 'g'), 'keyword');
            
            // تمييز القارات
            elements = processElements(elements, new RegExp(`([\\u0600-\\u06FF]*(?:${continents.join('|')})[\\u0600-\\u06FF]*)`, 'g'), 'continent');
            
            // تمييز الدول
            elements = processElements(elements, new RegExp(`([\\u0600-\\u06FF]*(?:${countries.join('|')})[\\u0600-\\u06FF]*)`, 'g'), 'country');
            
            // تمييز الكيانات الأخرى
            elements = processElements(elements, new RegExp(`([\\u0600-\\u06FF]*(?:${other_entities.join('|')})[\\u0600-\\u06FF]*)`, 'g'), 'other_entity');

            return elements.map((el, idx) => {
                if (el.type === 'concept') return <span key={idx} className="text-secondary font-black">{el.content}</span>;
                if (el.type === 'quote') return <span key={idx} className="text-purple-600 font-black">{el.content}</span>;
                if (el.type === 'parenthesis') return <span key={idx} className="text-blue-900 font-black mx-1">{el.content}</span>;
                if (el.type === 'manual') return <span key={idx} className="font-bold text-blue-600">{el.content}</span>;
                if (el.type === 'numbered_start') return <span key={idx} className="text-red-600 font-black mx-1">{el.content}</span>;
                
                // الألوان المخصصة حسب المطلوب
                if (el.type === 'number_date') return <span key={idx} className="text-red-600 font-black">{el.content}</span>;
                if (el.type === 'continent') return <span key={idx} className="text-green-600 font-black">{el.content}</span>;
                if (el.type === 'country') return <span key={idx} className="text-blue-700 font-black">{el.content}</span>;
                if (el.type === 'keyword') return <span key={idx} className="text-pink-600 font-black">{el.content}</span>;
                if (el.type === 'other_entity') return <span key={idx} className="text-gold font-black">{el.content}</span>;
                
                return <span key={idx} className="text-gray-800 whitespace-pre-line">{el.content}</span>;
            });
        };

        const formatQuestionText = (text, concept) => {
            if (text === undefined || text === null) return "";
            let processedText = String(text).replace(/(^|\s+)([0-9٠-٩]{1,2}\s*[-ـ\)])/g, '\n$2');
            
            let starterSpan = null;
            let remainingText = processedText;

            const tfRegex = /^(حدد صحة او خطأ العبارة التالية|حدد صحة أو خطأ العبارة التالية|حدد صحة او خطأ العبارة|حدد صحة أو خطأ العبارة|حدد صحة أو خطأ|صح أم خطأ|ضع علامة صح أو خطأ|اكتب كلمة صواب أو خطأ|هل العبارة صحيحة أم خطأ|هل العبارة صحيحة ام خاطئة مع التعليل|بالادلة حدد مدي صحة او خطأ العبارة|حدد مدى صحة أو خطأ العبارة)\s*[:؟\?\-]?\s*/i;
            const standardRegex = /^(بم تفسر|بما تفسر|ما النتائج المترتبة على|ما النتائج|دلل|أيد بالدليل|أيد|ماذا يحدث إذا|ماذا يحدث لو|قارن|ما العلاقة|اكتب المفهوم|اكتب ما تشير إليه|اكتب ما تشير|ما رأيك|ما مقترحات|ما مقترحاتك|حدد)\s*[:؟\?\-]?\s*/i;

            let match = processedText.match(tfRegex);
            if (match) {
                starterSpan = <span key="starter" className="text-indigo-700 font-black ml-2 text-2xl drop-shadow-sm">{match[0]}</span>;
                remainingText = processedText.substring(match[0].length);
            } else {
                match = processedText.match(standardRegex);
                if (match) {
                    // تمييز الأسئلة المقالية باللون الأحمر الداكن
                    starterSpan = <span key="starter" className="text-red-800 font-black ml-2 text-2xl">{match[0]}</span>;
                    remainingText = processedText.substring(match[0].length);
                } else {
                    const colonMatch = processedText.match(/^([^:]{1,45}[:])\s*/);
                    if (colonMatch) {
                        starterSpan = <span key="starter" className="text-red-800 font-black ml-2 text-2xl">{colonMatch[0]}</span>;
                        remainingText = processedText.substring(colonMatch[0].length);
                    }
                }
            }

            return (
                <React.Fragment>
                    {starterSpan}
                    {highlightText(remainingText, concept)}
                </React.Fragment>
            );
        };

        const DrawingCanvas = ({ isEnabled }) => {
            const canvasRef = useRef(null); const ctxRef = useRef(null); const [isDrawing, setIsDrawing] = useState(false); const pointsRef = useRef([]);
            useEffect(() => {
                const canvas = canvasRef.current; canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d'); ctx.lineCap = 'round'; ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 4; ctxRef.current = ctx;
                const handleResize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; ctxRef.current.lineCap='round'; ctxRef.current.strokeStyle='#16a34a'; ctxRef.current.lineWidth=4; };
                window.addEventListener('resize', handleResize); return () => window.removeEventListener('resize', handleResize);
            }, []);
            const startDrawing = (e) => { if(!isEnabled) return; const rect = canvasRef.current.getBoundingClientRect(); const x = (e.clientX || e.touches[0].clientX) - rect.left; const y = (e.clientY || e.touches[0].clientY) - rect.top; ctxRef.current.beginPath(); ctxRef.current.moveTo(x, y); setIsDrawing(true); pointsRef.current = [{x, y}]; };
            const draw = (e) => { if(!isDrawing || !isEnabled) return; e.preventDefault(); const rect = canvasRef.current.getBoundingClientRect(); const x = (e.clientX || e.touches[0].clientX) - rect.left; const y = (e.clientY || e.touches[0].clientY) - rect.top; ctxRef.current.lineTo(x, y); ctxRef.current.stroke(); pointsRef.current.push({x, y}); };
            const stopDrawing = () => { if(!isDrawing) return; ctxRef.current.closePath(); setIsDrawing(false); checkIfCheckmark(pointsRef.current); };
            const checkIfCheckmark = (points) => {
                if(points.length < 15) return;
                let maxY = 0; let lowestIndex = 0;
                points.forEach((p, i) => { if(p.y > maxY){ maxY = p.y; lowestIndex = i; } });
                if(lowestIndex > points.length * 0.1 && lowestIndex < points.length * 0.9) {
                    let drops = 0; for(let i = 1; i < points.length; i++) { if(points[i].x < points[i-1].x - 10) drops++; }
                    if(drops < 3) { ctxRef.current.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); pointsRef.current = []; }
                }
            };
            return <canvas ref={canvasRef} id="drawing-canvas" className={isEnabled ? 'active' : ''} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseOut={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}></canvas>;
        };

        const App = () => {

            const [studentName, setStudentName] = useState('');
            const [inputPhone, setInputPhone] = useState('');
            const [showPasswordInput, setShowPasswordInput] = useState(false);
            const [inputPassword, setInputPassword] = useState('');
            const [selectedTwin, setSelectedTwin] = useState(null);
            
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [showWelcomeSubscribeModal, setShowWelcomeSubscribeModal] = useState(false);
            const [registerName, setRegisterName] = useState('');
            const [registerMethod, setRegisterNameMethod] = useState('');
            
            const [platformFee, setPlatformFee] = useState(PAYMENT_INFO.fee);
            const [newFeeInput, setNewFeeInput] = useState('');
            
            const [isLoading, setIsLoading] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [studentData, setStudentData] = useState(null);
            
            const [showUnpaidModal, setShowUnpaidModal] = useState(false);
            const [unpaidPaymentMethod, setUnpaidPaymentMethod] = useState('');
            
            const [adminResults, setAdminResults] = useState([]);
            const [adminPendingReqs, setAdminPendingReqs] = useState([]);
            const [adminActiveTab, setAdminActiveTab] = useState('results');
            const [searchQuery, setSearchQuery] = useState('');
            const [expandedAdminStudent, setExpandedAdminStudent] = useState(null);
            
            const [activeLesson, setActiveLesson] = useState(null);
            const [data, setData] = useState([]); 
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]);
            const [isDrawingMode, setIsDrawingMode] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [activeFilter, setActiveFilter] = useState('all');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [expandedUnits, setExpandedUnits] = useState([]);
            const [studentsList, setStudentsList] = useState({});
            
            // متغير للتحكم في نافذة الشرح الذكية
            const [lessonModalOptions, setLessonModalOptions] = useState(null);

            // إضافة متغيرات حالة الإشعار للطلاب 📢
            const [announcement, setAnnouncement] = useState('');
            const [announcementInput, setAnnouncementInput] = useState('');

            // 🗺️ إضافة قسم الخرائط المستقل (يجلب بياناته من جوجل شيت الآن)
            const [activeMapUrl, setActiveMapUrl] = useState(null);
            const [mapsList, setMapsList] = useState([]);

            const [mistakesBank, setMistakesBank] = useState(() => {
                const saved = localStorage.getItem('mistakesBank');
                return saved ? JSON.parse(saved) : [];
            });
            
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);

            const [dialog, setDialog] = useState({ isOpen: false, message: '', type: 'alert', onConfirm: null });
            const showAlert = (message) => setDialog({ isOpen: true, message, type: 'alert', onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm });
            const closeDialog = () => setDialog({ isOpen: false, message: '', type: 'alert', onConfirm: null });

            useEffect(() => {
                window.history.pushState({ screen: 'home' }, '');
                const handlePopState = () => {
                    if (screen === 'quiz') {
                        showConfirm('هل أنت متأكد من مغادرة الاختبار؟\nسيتم حفظ تقدمك الحالي.', () => setScreen('index'));
                        window.history.pushState({ screen: 'quiz' }, ''); 
                    }
                    else if (screen === 'index') {
                        showConfirm('هل أنت متأكد من الخروج من الحساب؟\n(ملاحظة: سيتم الاحتفاظ بمستوى تقدمك في الاختبار ولن يتم مسحه)', () => handleLogout());
                        window.history.pushState({ screen: 'index' }, ''); 
                    }
                    else if (screen === 'result') setScreen('index');
                    else if (screen === 'admin') setScreen('home');
                    else window.history.pushState(null, ''); 
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [screen]);

            useEffect(() => {
                if (screen === 'quiz' && activeLesson && activeLesson.id !== 'mistakes_bank') {
                    const sessionData = { lessonId: activeLesson.id, unitId: data.find(u => u.lessons.some(l => l.id === activeLesson.id))?.id, answers: userAnswers, currentIndex: currentQIndex };
                    localStorage.setItem('savedSession', JSON.stringify(sessionData));
                    const handleBeforeUnload = (e) => { e.returnValue = 'مغادرة الاختبار؟'; };
                    window.addEventListener('beforeunload', handleBeforeUnload);
                    return () => window.removeEventListener('beforeunload', handleBeforeUnload);
                } else if (screen === 'result') localStorage.removeItem('savedSession');
            }, [screen, activeLesson, userAnswers, currentQIndex, data]);

            useEffect(() => {
                const loadStudents = async () => {
                    try {
                        const response = await fetch(`${API_URL}?action=getAllStudents&apiKey=${SECRET_API_KEY}`);
                        const result = await response.json();
                        if(result.status === 'success') {
                            if(result.data) {
                                setStudentsList(result.data);
                                const savedPhone = localStorage.getItem('loggedInPhone');
                                const savedUserStr = localStorage.getItem('loggedInUser');
                                if (savedPhone && savedUserStr) {
                                    const savedUser = JSON.parse(savedUserStr);
                                    let liveStudents = result.data[savedPhone];
                                    if (liveStudents) {
                                        if (!Array.isArray(liveStudents)) liveStudents = [liveStudents];
                                        const liveSt = liveStudents.find(s => s.name === savedUser.name);
                                        if (liveSt && (liveSt.isPaid === false || (liveSt.missingMonths && liveSt.missingMonths.length > 0))) {
                                            localStorage.removeItem('loggedInUser');
                                            localStorage.removeItem('loggedInPhone');
                                            setStudentData(null);
                                            setStudentName('');
                                            setScreen('home');
                                        }
                                    }
                                }
                            }
                            if(result.fee) setPlatformFee(result.fee);
                            if(result.announcement !== undefined) setAnnouncement(result.announcement); // تحميل الإشعار الفعلي للطلاب
                        }
                    } catch(e) {}
                };
                loadStudents();
            }, []);

            useEffect(() => {
                const savedUser = localStorage.getItem('loggedInUser');
                const savedPhone = localStorage.getItem('loggedInPhone');
                if (savedUser && savedPhone) {
                    const st = JSON.parse(savedUser);
                    setStudentData(st);
                    setStudentName(st.name);
                    setInputPhone(savedPhone);
                    if (st.isPaid || !st.missingMonths || st.missingMonths.length === 0) {
                        setScreen('returning_welcome');
                    }
                }
            }, []);

            // مزامنة حقل إدخال الإشعار في لوحة الإدارة مع القيمة المخزنة
            useEffect(() => {
                setAnnouncementInput(announcement);
            }, [announcement]);

            const toggleUnit = (unitId) => setExpandedUnits(prev => prev.includes(unitId) ? prev.filter(id => id !== unitId) : [...prev, unitId]);
            const toggleFullscreen = () => { if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(e=>console.log(e)); setIsFullscreen(true); } else { document.exitFullscreen(); setIsFullscreen(false); } };

            const stats = useMemo(() => {
                let total = 0, completed = 0;
                data.forEach(unit => { unit.lessons.forEach(l => { total++; if (l.completed) completed++; }); });
                return { total, completed, remaining: total - completed, progress: total ? Math.round((completed/total)*100) : 0 };
            }, [data]);

            // حفظ الإحصائيات في الذاكرة لتظهر في شاشة الترحيب
            useEffect(() => {
                if (stats.total > 0) {
                    localStorage.setItem('userStats', JSON.stringify(stats));
                }
            }, [stats]);

            const handleResume = async () => {
                setIsLoading(true);
                try {
                    const qRes = await fetch(`${API_URL}?action=getQuestions&apiKey=${SECRET_API_KEY}`); 
                    const qData = await qRes.json();
                    if (qData.status === 'success') {
                        const builtData = buildCourseData(qData.data);
                        setData(builtData);
                        if (qData.maps) setMapsList(qData.maps); else setMapsList([]); // 🗺️ تحديث الخرائط
                        const session = localStorage.getItem('savedSession');
                        if (session) {
                            const parsedSession = JSON.parse(session);
                            let foundLesson = null;
                            builtData.forEach(u => { const l = u.lessons.find(l => l.id === parsedSession.lessonId); if (l) foundLesson = l; });
                            if (foundLesson) {
                                setActiveLesson(foundLesson); setUserAnswers(parsedSession.answers || []); setCurrentQIndex(parsedSession.currentIndex || 0); setScreen('quiz');
                            } else setScreen('index');
                        } else setScreen('index');
                    } else { setLoginError("فشل تحميل الأسئلة من السيرفر."); setScreen('home'); }
                } catch(e) { setLoginError("حدث خطأ أثناء جلب الأسئلة."); setScreen('home'); }
                setIsLoading(false);
            };

            // دالة التحديث المباشر للمنصة (تحدث الأسئلة، الطلاب، الإعلانات، الأسعار، والخرائط دفعة واحدة)
            const handleRefresh = async () => {
                setIsLoading(true);
                try {
                    const qRes = await fetch(`${API_URL}?action=getQuestions&apiKey=${SECRET_API_KEY}`);
                    const qData = await qRes.json();
                    
                    const sRes = await fetch(`${API_URL}?action=getAllStudents&apiKey=${SECRET_API_KEY}`);
                    const sData = await sRes.json();
                    
                    if (qData.status === 'success') {
                        setData(buildCourseData(qData.data));
                        if (qData.maps) setMapsList(qData.maps); else setMapsList([]); // 🗺️ تحديث الخرائط
                        if (sData.status === 'success') {
                            if (sData.announcement !== undefined) setAnnouncement(sData.announcement);
                            if (sData.fee) setPlatformFee(sData.fee);
                            if (sData.data) setStudentsList(sData.data);
                        }
                        showAlert('تم تحديث المحتوى والإشعارات بنجاح! 🚀');
                    } else {
                        showAlert("فشل التحديث من السيرفر.");
                    }
                } catch(e) {
                    showAlert("حدث خطأ أثناء جلب التحديثات.");
                }
                setIsLoading(false);
            };

            const handleLogout = () => {
                showConfirm('هل أنت متأكد من الخروج من الحساب؟\n(ملاحظة: سيتم الاحتفاظ بمستوى تقدمك في الاختبار ولن يتم مسحه)', () => {
                    localStorage.removeItem('loggedInUser');
                    localStorage.removeItem('loggedInPhone');
                    setStudentData(null);
                    setStudentName('');
                    setInputPhone('');
                    setInputPassword('');
                    setShowPasswordInput(false);
                    setScreen('home');
                });
            };

            const handleLogin = async () => {
                setLoginError(''); const formattedPhone = formatPhoneStr(inputPhone);
                if (!formattedPhone || formattedPhone.length < 10) { setLoginError('يرجى إدخال رقم هاتف صحيح.'); return; }
                setIsLoading(true);

                const loadQuestionsAndNavigate = async (targetScreen) => {
                    try {
                        const qRes = await fetch(`${API_URL}?action=getQuestions&apiKey=${SECRET_API_KEY}`); const qData = await qRes.json();
                        if (qData.status === 'success') {
                            setData(buildCourseData(qData.data));
                            if (qData.maps) setMapsList(qData.maps); else setMapsList([]); // 🗺️ تحديث الخرائط
                            setScreen(targetScreen); 
                        } else setLoginError("فشل تحميل الأسئلة من السيرفر.");
                    } catch(e) { setLoginError("حدث خطأ أثناء جلب الأسئلة."); }
                };

                if (BASE_STUDENTS[formattedPhone]) {
                    if (!showPasswordInput) { setShowPasswordInput(true); setIsLoading(false); return; }
                    const user = BASE_STUDENTS[formattedPhone];
                    const inputHash = simpleHash(inputPassword);
                    if (inputHash === user.passHash) {
                        setStudentName(user.name);
                        if (user.role === 'admin') { fetchAdminData(); await loadQuestionsAndNavigate('admin'); } 
                        else if (user.role === 'secretary') { await loadQuestionsAndNavigate('index'); }
                        setShowPasswordInput(false); setInputPassword('');
                    } else setLoginError("الرقم السري خاطئ.");
                    setIsLoading(false); return;
                }

                let localStudents = studentsList[formattedPhone];
                if (localStudents) {
                    if (!Array.isArray(localStudents)) localStudents = [localStudents];
                    if (localStudents.length > 1 && !selectedTwin) { setLoginError('اختر اسمك من القائمة أولاً.'); setIsLoading(false); return; }
                    const st = selectedTwin || localStudents[0];
                    
                    if (st.isPaid === false || (st.missingMonths && st.missingMonths.length > 0)) {
                        setStudentData(st); setShowUnpaidModal(true); setIsLoading(false); return;
                    }

                    setStudentName(st.name); setStudentData(st);
                    
                    const fingerprint = generateDeviceFingerprint();
                    try {
                        const fpRes = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveDeviceFingerprint', phone: `${formattedPhone}_${st.name}`, fingerprint: fingerprint, apiKey: SECRET_API_KEY }) });
                        const fpData = await fpRes.json();
                        if (fpData.status === 'blocked') { setLoginError('لا يمكن فتح التطبيق! لقد سبق واستخدم هذا الحساب في متصفح آخر.'); setIsLoading(false); return; }
                    } catch(e) {}

                    localStorage.setItem('loggedInUser', JSON.stringify(st));
                    localStorage.setItem('loggedInPhone', formattedPhone);
                    await loadQuestionsAndNavigate('index');
                    setIsLoading(false); return;
                }

                try {
                    const response = await fetch(`${API_URL}?action=login&phone=${formattedPhone}&apiKey=${SECRET_API_KEY}`);
                    const result = await response.json();
                    if (result.status === 'success') {
                        let fetchedStudents = Array.isArray(result.student) ? result.student : [result.student];
                        if (fetchedStudents.length > 1 && !selectedTwin) {
                            setStudentsList(prev => ({...prev, [formattedPhone]: fetchedStudents}));
                            setLoginError('الرجاء اختيار اسمك أولاً.'); setIsLoading(false); return;
                        }
                        const st = selectedTwin || fetchedStudents[0];
                        
                        if (st.isPaid === false || (st.missingMonths && st.missingMonths.length > 0)) {
                            setStudentData(st); setShowUnpaidModal(true); setIsLoading(false); return;
                        }

                        setStudentName(st.name); setStudentData(st);
                        
                        const fingerprint = generateDeviceFingerprint();
                        const fpRes = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveDeviceFingerprint', phone: `${formattedPhone}_${st.name}`, fingerprint: fingerprint, apiKey: SECRET_API_KEY }) });
                        const fpData = await fpRes.json();
                        if (fpData.status === 'blocked') { setLoginError('لا يمكن فتح التطبيق! لقد سبق واستخدم هذا الحساب في متصفح آخر.'); setIsLoading(false); return; }

                        localStorage.setItem('loggedInUser', JSON.stringify(st));
                        localStorage.setItem('loggedInPhone', formattedPhone);
                        await loadQuestionsAndNavigate('index');
                    } else if (result.status === 'unregistered' || result.message === 'الرقم غير مسجل لدينا.') {
                        const reqRes = await fetch(`${API_URL}?action=getPendingRequests&apiKey=${SECRET_API_KEY}`); const reqData = await reqRes.json();
                        if (reqData.status === 'success' && reqData.data && reqData.data.some(r => formatPhoneStr(r.phone) === formattedPhone)) setLoginError('طلبك قيد مراجعة الإدارة.');
                        else setShowWelcomeSubscribeModal(true);
                    } else setLoginError(result.message || 'حدث خطأ.');
                } catch (error) { setLoginError('خطأ في الاتصال بالإنترنت.'); }
                setIsLoading(false);
            };

            const fetchAdminData = async () => {
                setIsLoading(true);
                try {
                    const res = await fetch(`${API_URL}?action=getResults&apiKey=${SECRET_API_KEY}`); const resData = await res.json();
                    if(resData.status === 'success') {
                        const grouped = {};
                        resData.data.forEach(r => {
                            if(!grouped[r.name]) grouped[r.name] = { phone: r.phone, tests: [] };
                            grouped[r.name].tests.push(r);
                        });
                        const sortedArray = Object.keys(grouped).sort((a,b)=>a.localeCompare(b, 'ar')).map(k => ({ name: k, ...grouped[k] }));
                        setAdminResults(sortedArray);
                    }
                    const reqRes = await fetch(`${API_URL}?action=getPendingRequests&apiKey=${SECRET_API_KEY}`); const reqData = await reqRes.json();
                    if(reqData.status === 'success') setAdminPendingReqs(reqData.data);
                } catch(e) { showAlert('فشل الاتصال بقاعدة البيانات.'); }
                setIsLoading(false);
            };

            const handleRegisterSubmit = async () => {
                if (!registerName || !registerMethod) { showAlert('أدخل الاسم واختر طريقة الدفع.'); return; }
                const formattedPhone = formatPhoneStr(inputPhone); const sheetPhone = '+20' + formattedPhone.substring(1);
                const whatsappMsg = `السلام عليكم ورحمة الله وبركاته، أ/ إسلام سعود.\nأود الاشتراك في منصة الكنز التعليمي\nالاسم: ${registerName}\nرقم الهاتف: ${inputPhone}\nالمرحلة: ${gradeName}\nقمت بالسداد من خلال: ${registerMethod}\n(سأقوم بإرفاق صورة التحويل الآن لتأكيد السداد)`;
                window.location.href = `https://wa.me/201228466613?text=${encodeURIComponent(whatsappMsg)}`;
                try { fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'requestSubscription', date: new Date().toLocaleString('ar-EG'), name: registerName, phone: sheetPhone, method: registerMethod, apiKey: SECRET_API_KEY }) }); } catch(e) {}
            };

            const handleActivateMonth = async (phone, name, month) => {
                showConfirm(`تفعيل شهر (${month}) للطالب: ${name}؟`, async () => {
                    try {
                        fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'activateSpecificMonth', phone: phone, month: month, apiKey: SECRET_API_KEY }) });
                        setStudentsList(prev => {
                            const newList = {...prev};
                            if(newList[phone]) newList[phone] = newList[phone].map(s => s.name === name ? { ...s, missingMonths: s.missingMonths.filter(m => m !== month), isPaid: s.missingMonths.length <= 1 } : s);
                            return newList;
                        });
                        showAlert(`تم تفعيل شهر ${month}`);
                    } catch(e) { showAlert('حدث خطأ'); }
                });
            };

            const handleApproveSubscription = async (phone, name) => {
                showConfirm(`تفعيل حساب: ${name}؟`, async () => {
                    window.open(`https://wa.me/20${formatPhoneStr(phone).substring(1)}?text=${encodeURIComponent(`أهلا بك ${name} تم التفعيل`)}`, '_blank');
                    setAdminPendingReqs(prev => prev.filter(req => req.phone !== phone || req.name !== name));
                    try { 
                        await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'approveSubscription', phone: phone, name: name, apiKey: SECRET_API_KEY }) }); 
                        showAlert('تم التفعيل بنجاح وإضافة الطالب لجوجل شيت!'); 
                        setTimeout(fetchAdminData, 2000);
                    } catch(e) { showAlert('خطأ في الاتصال بالخادم'); }
                });
            };

            const handleRejectSubscription = async (phone, name) => {
                showConfirm(`رفض طلب: ${name}؟`, async () => {
                    setAdminPendingReqs(prev => prev.filter(req => req.phone !== phone || req.name !== name));
                    try { 
                        await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'rejectSubscription', phone: phone, name: name, apiKey: SECRET_API_KEY }) }); 
                        showAlert('تم الرفض وإزالة الطلب من جوجل شيت!'); 
                        setTimeout(fetchAdminData, 2000);
                    } catch(e) { showAlert('خطأ في الاتصال بالخادم'); }
                });
            };

            const handleUpdateFee = async () => {
                const finalFee = newFeeInput ? newFeeInput : platformFee;
                setIsLoading(true);
                try {
                    await fetch(API_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({ 
                            action: 'updateSettings', 
                            fee: finalFee, 
                            announcement: announcementInput, // إرسال وحفظ الإشعار الجديد للطلاب
                            apiKey: SECRET_API_KEY 
                        }) 
                    });
                    showAlert('تم حفظ الإعدادات وتحديث الإشعار للطلاب بنجاح! 📢');
                    setPlatformFee(finalFee);
                    setAnnouncement(announcementInput);
                    setNewFeeInput('');
                } catch(e) { 
                    showAlert('خطأ في الاتصال بالإنترنت'); 
                }
                setIsLoading(false);
            };

            const saveResultToDB = async (scoreObj) => {
                try {
                    const formattedPhone = formatPhoneStr(inputPhone); if (BASE_STUDENTS[formattedPhone]) return;
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveResult', phone: formattedPhone.startsWith('0') ? '+20'+formattedPhone.substring(1) : formattedPhone, name: studentName, quiz: scoreObj.quizName, score: scoreObj.score, date: new Date().toLocaleString('ar-EG'), apiKey: SECRET_API_KEY }) });
                } catch(e) {}
            };

            const handleTouchStart = (e) => {
                touchStartX.current = e.touches[0].clientX;
                touchEndX.current = null;
            };
            
            const handleTouchMove = (e) => {
                touchEndX.current = e.touches[0].clientX;
            };
            
            const handleTouchEnd = () => {
                if (touchStartX.current === null || touchEndX.current === null || isDrawingMode) return;
                
                const swipeDistance = touchStartX.current - touchEndX.current;
                
                if (swipeDistance > 40) {
                    if (isAnswered && currentQIndex < activeLesson.questions.length - 1) {
                        setCurrentQIndex(currentQIndex + 1);
                    } else if (isAnswered && currentQIndex === activeLesson.questions.length - 1) {
                        handleFinishQuiz();
                    }
                } else if (swipeDistance < -40) {
                    if (currentQIndex > 0) {
                        setCurrentQIndex(currentQIndex - 1);
                    }
                }
                
                touchStartX.current = null;
                touchEndX.current = null;
            };

            const handleFinishQuiz = () => {
                if (activeLesson) {
                    const totalQs = activeLesson.questions.length;
                    const correct = userAnswers.filter(a => a.isCorrect).length;
                    const perc = Math.round((correct/totalQs)*100);
                    if (activeLesson.id !== 'mistakes_bank') {
                        saveResultToDB({ quizName: activeLesson.title, score: `${perc}%` });
                    }
                }
                setScreen('result');
            };

            // دالة مساعدة للدخول المباشر للتدريبات (سواء من الفهرس أو من النافذة المنبثقة)
            const startQuizForLesson = (lesson) => {
                const session = localStorage.getItem('savedSession'); let restored = false;
                if (session) {
                    const parsed = JSON.parse(session);
                    if (parsed.lessonId === lesson.id) {
                        setActiveLesson(lesson); setUserAnswers(parsed.answers || []); setCurrentQIndex(parsed.currentIndex || 0); setScreen('quiz'); restored = true;
                    }
                }
                if (!restored) { setActiveLesson(lesson); setCurrentQIndex(0); setUserAnswers([]); setScreen('quiz'); }
                setLessonModalOptions(null); // إغلاق النافذة المنبثقة إن كانت مفتوحة
            };

            let isAnswered = false; let currentAnswer = null; let question = null; let totalQs = 0;
            if (screen === 'quiz' && activeLesson) {
                question = activeLesson.questions[currentQIndex]; totalQs = activeLesson.questions.length;
                if (question) {
                    isAnswered = userAnswers[currentQIndex] !== undefined; currentAnswer = userAnswers[currentQIndex];
                }
            }

            const renderScreen = () => {
                if (screen === 'returning_welcome') {
                    const savedStats = JSON.parse(localStorage.getItem('userStats') || 'null');
                    return (
                        <div className="h-[100dvh] w-full flex items-center justify-center p-4 bg-gray-50">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-md w-full border-t-8 border-secondary animate-fade-in relative overflow-hidden">
                                <i className="fas fa-hand-sparkles text-6xl text-secondary mb-6 block relative z-10"></i>
                                <h2 className="text-3xl font-black text-primary mb-4 relative z-10">مرحباً يا بطل {studentName.split(' ')[0]}!</h2>
                                
                                {savedStats && savedStats.completed > 0 ? (
                                    <div className="mb-6 relative z-10">
                                        <p className="text-lg text-gray-700 font-bold mb-2">
                                            لقد أنجزت <span className="text-secondary font-black text-xl mx-1">{toEasternArabic(savedStats.completed)}</span> من الدروس بنجاح 🏆
                                        </p>
                                        <p className="text-lg text-pink-600 font-black bg-pink-50 py-2 px-4 rounded-xl border border-pink-100 inline-block shadow-sm">
                                            {savedStats.remaining > 0 ? `هانت يا بطل.. باقي ${toEasternArabic(savedStats.remaining)} فقط! 💪` : 'لقد أنهيت جميع الدروس! 🎉'}
                                        </p>
                                    </div>
                                ) : (
                                    <React.Fragment>
                                        <p className="text-lg text-gray-600 font-semibold mb-2 relative z-10">هل مستعد لنكمل مغامرتنا؟</p>
                                        <p className="text-lg text-pink-600 font-black mb-8 relative z-10">أنت قد المسؤولية.. نبدأ يا بطل!</p>
                                    </React.Fragment>
                                )}
                                
                                <button onClick={handleResume} disabled={isLoading} className="bg-secondary text-white font-black text-xl py-4 px-10 rounded-full w-full shadow-lg mb-4 hover:bg-green-600 transition-colors relative z-10 mt-2">
                                    {isLoading ? <i className="fas fa-spinner fa-spin"></i> : 'نعم 🚀'}
                                </button>
                                <button onClick={handleLogout} className="text-gray-500 font-bold text-sm underline hover:text-red-500 mt-2 relative z-10">
                                    تسجيل خروج (لست {studentName.split(' ')[0]})
                                </button>
                            </div>
                        </div>
                    );
                }

                if (screen === 'home') {
                    const livePhone = formatPhoneStr(inputPhone); const liveAdmin = BASE_STUDENTS[livePhone];
                    let liveStudents = studentsList[livePhone]; if (liveStudents && !Array.isArray(liveStudents)) liveStudents = [liveStudents];

                    return (
                        <div className="h-[100dvh] w-full flex items-center justify-center p-4 md:p-6 overflow-y-auto custom-scrollbar relative bg-[#f8fafc] watermark-container">
                            <div className="w-full max-w-2xl flex flex-col items-center gap-4 sm:gap-5 py-6 z-10 my-auto">

                                                        <div className="flex flex-wrap justify-center gap-2">
                                                            {liveStudents.map((st, idx) => <button key={idx} onClick={() => { setSelectedTwin(st); setLoginError(''); }} className={`px-4 py-2 rounded-xl font-bold text-xs sm:text-sm border-2 ${selectedTwin?.name === st.name ? 'bg-secondary text-white border-secondary' : 'bg-white text-gray-700 hover:border-secondary'}`}>{st.name}</button>)}

                                        {loginError && <div className="text-red-500 text-xs sm:text-sm font-bold mt-4 text-center bg-red-50 py-2 px-3 rounded-lg border border-red-100"><i className="fas fa-exclamation-circle"></i> {loginError}</div>}

                                    <div className="text-center mt-4 text-lg sm:text-xl flex justify-center gap-1.5 w-full">
                                    <span className="text-primary font-bold">رؤية وإعداد</span> <span className="text-pink-600 font-black">أ/ إسلام سعود</span>
                                </div>

                        </div>

                        {showUnpaidModal && studentData && (

                                        <button onClick={() => setUnpaidPaymentMethod('إنستاباي')} className={`flex-1 p-3 rounded-xl border-2 font-black transition-all ${unpaidPaymentMethod === 'إنستاباي' ? 'bg-purple-50 border-purple-500 text-purple-600' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>إنستاباي</button>

                                            if (!unpaidPaymentMethod) { showAlert('الرجاء اختيار طريقة الدفع (فودافون كاش أو إنستاباي) أولاً.'); return; }
                                            const whatsappMsg = `السلام عليكم ورحمة الله وبركاته، أ/ إسلام سعود.\nأنا الطالب(ة): ${studentData.name}\nأرغب في سداد متأخرات شهر (${studentData.missingMonths?.join('، ')}) لتفعيل حسابي.\nقمت بالسداد من خلال: ${unpaidPaymentMethod}\n(سأقوم بإرفاق صورة التحويل الآن لتأكيد السداد)`;
                                            window.location.href = `https://wa.me/201228466613?text=${encodeURIComponent(whatsappMsg)}`;
                                        }} className="w-full bg-secondary text-white font-black text-lg py-3 rounded-xl shadow-md hover:bg-green-700 transition-colors flex justify-center items-center gap-2">
                                            <i className="fab fa-whatsapp text-xl"></i> إرسال صورة التحويل
                                        </button>
                                        <button onClick={() => {setShowUnpaidModal(false); setStudentData(null); setUnpaidPaymentMethod('');}} className="w-full bg-gray-200 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-300 transition-colors">إغلاق وعودة</button>

                                </div>

                                        <div className="flex gap-3">
                                            <button onClick={() => { setShowWelcomeSubscribeModal(false); setShowRegisterModal(true); }} className="flex-1 bg-secondary text-white font-black text-lg py-3 rounded-xl shadow-md hover:bg-green-700 transition-colors">نعم</button>

                                    </div>

                                            <span className="text-primary font-black text-xl" dir="ltr">01228466613</span>

                                        <div className="flex gap-2 mb-4">

                                            <button onClick={() => setRegisterNameMethod('إنستاباي')} className={`flex-1 p-3 rounded-xl border-2 font-black transition-all ${registerMethod === 'إنستاباي' ? 'bg-purple-50 border-purple-500 text-purple-600' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>إنستاباي</button>

                                        </button>
                                        <button onClick={()=>setIsDarkMode(!isDarkMode)} className={`w-6 h-6 md:w-8 md:h-8 rounded-md flex items-center justify-center text-[10px] md:text-sm shadow-sm transition-colors shrink-0 border ${isDarkMode ? 'bg-gray-700 text-white border-gray-600 hover:bg-gray-600' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'}`} title="ليلي">

                                        </button>

                                            تحديث <i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i>
                                        </button>

                                        <button onClick={() => showConfirm('هل أنت متأكد من مسح جميع إجاباتك والبدء من جديد؟', () => {
                                            // 1. تجميع أسماء الدروس التي تم إنجازها قبل مسحها
                                            const completedLessonNames = [];
                                            data.forEach(u => u.lessons.forEach(l => { if(l.completed) completedLessonNames.push(l.title); }));
                                            
                                            // 2. إرسال إشعار للإدارة إذا كان هناك دروس تم تصفيرها فعلاً
                                            if (completedLessonNames.length > 0) {
                                                saveResultToDB({ 
                                                    quizName: `تصفير 🗑️: ${completedLessonNames.join(' ، ')}`, 
                                                    score: 'تصفير 🔄' 
                                                });
                                            }

                                            // 3. المسح والتصفير كما هو
                                            localStorage.removeItem('completedLessons');
                                            localStorage.removeItem('userStats');
                                            localStorage.removeItem('savedSession');
                                            localStorage.removeItem('mistakesBank');
                                            setMistakesBank([]);
                                            const resetData = data.map(unit => ({ ...unit, lessons: unit.lessons.map(l => ({ ...l, completed: false })) }));
                                            setData(resetData); setActiveFilter('all');

                                        </button>

                                            خروج <i className="fas fa-sign-out-alt"></i>
                                        </button>

                                        <div className="text-sm sm:text-base font-black flex items-center gap-0.5 text-secondary" dir="ltr">
                                            <span>%</span><span>{toEasternArabic(stats.progress)}</span>

                                    </div>
                                    <button onClick={()=>setActiveFilter('all')} className={`flex-1 lg:flex-none lg:w-24 rounded-xl py-2 px-1 flex flex-col items-center justify-center shadow-md transition-all min-w-[65px] ${activeFilter==='all'?'bg-secondary text-white ring-2 ring-offset-1 ring-secondary':'bg-secondary text-white opacity-90'}`}>
                                        <div className="text-[10px] sm:text-xs font-bold text-green-100 mb-0.5">الدروس</div>
                                        <div className="text-sm sm:text-base font-black">{toEasternArabic(stats.total)}</div>
                                    </button>
                                    <button onClick={()=>setActiveFilter('completed')} className={`flex-1 lg:flex-none lg:w-24 rounded-xl py-2 px-1 flex flex-col items-center justify-center border shadow-sm transition-all min-w-[65px] ${activeFilter==='completed'?'bg-green-50 border-green-500 ring-1 ring-green-500':'bg-white border-gray-200 hover:border-green-400'}`}>
                                        <div className="text-[10px] sm:text-xs font-bold text-green-500 mb-0.5">المنجز</div>

                                    </button>

                                    </button>

                                        <button onClick={() => {
                                            setActiveLesson({ id: 'mistakes_bank', title: 'بنك الأخطاء 🎯', questions: mistakesBank, completed: false });

                                            setUserAnswers([]);
                                            setScreen('quiz');
                                        }} className="flex-1 lg:flex-none lg:w-24 rounded-xl py-2 px-1 flex flex-col items-center justify-center shadow-md transition-all min-w-[65px] bg-rose-50 border-2 border-rose-500 ring-2 ring-offset-1 ring-rose-500 animate-pulse relative overflow-hidden">

                                            <div className="text-sm sm:text-base font-black text-rose-700 relative z-10">{toEasternArabic(mistakesBank.length)}</div>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {mapsList && mapsList.length > 0 && (
                                <div className="px-4 mt-2 mb-2 w-full max-w-4xl mx-auto z-10 shrink-0">
                                    <button onClick={() => setScreen('maps')} className={`w-full font-black py-3.5 rounded-2xl shadow-sm transition-transform active:scale-95 flex justify-center items-center gap-3 border-2 ${isDarkMode ? 'bg-indigo-900 border-indigo-700 text-indigo-100 hover:bg-indigo-800' : 'bg-indigo-50 border-indigo-200 text-indigo-800 hover:bg-indigo-100'}`}>
